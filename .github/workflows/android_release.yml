name: MYL Palakkad - Build Signed Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (Stable 3.24.5)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Clean & Auto-Fix Project Files
        run: |
          # ഫയലുകൾ സബ്-ഫോൾഡറിലാണെങ്കിൽ പുറത്തേക്ക് മാറ്റുന്നു
          if [ -d "myl_palakkad_app" ]; then
            cp -r myl_palakkad_app/* .
            rm -rf myl_palakkad_app
          fi

          # Clean pubspec.yaml എഴുതുന്നു
          cat << 'EOF' > pubspec.yaml
          name: myl_palakkad_app
          description: Official Mobile Application for Muslim Youth League Palakkad District Committee.
          publish_to: 'none'
          version: 1.2.0+3

          environment:
            sdk: '>=3.2.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            pdf: ^3.11.1
            printing: ^5.13.2
            url_launcher: ^6.3.0
            intl: ^0.19.0

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
            assets:
              - assets/fonts/
              - assets/images/
          EOF

          # പഴയ android ഫോൾഡർ മാറ്റി പുതിയത് നിർമ്മിക്കുന്നു, തുടർന്ന് test ഫോൾഡർ നീക്കം ചെയ്യുന്നു
          rm -rf android test pubspec.lock
          flutter create --org org.mylpalakkad --project-name myl_palakkad_app --platforms android .
          rm -rf test

          # മുറിഞ്ഞുപോയ ഒറ്റ വരി സ്ട്രിംഗുകൾ Python വഴി കൃത്യമായി തിരുത്തുന്നു
          python3 - << 'PYEOF'
          for filepath in ['lib/main.dart', 'lib/screens/blood_bank_screen.dart']:
              with open(filepath, 'r', encoding='utf-8') as f:
                  content = f.read()
              # Fix broken multiline string in main.dart
              content = content.replace("subtitle: Text('${ann['date']}\n${ann['description']}'),", "subtitle: Text('${ann['date']} - ${ann['description']}'),")
              # Fix broken multiline string in blood_bank_screen.dart
              content = content.replace("child: Text('${donor.mandalam} • ${donor.panchayat} (${donor.shakha})\nഫോൺ: ${donor.phone}'),", "child: Text('${donor.mandalam} • ${donor.panchayat} (${donor.shakha}) | ഫോൺ: ${donor.phone}'),")
              content = content.replace("activeColor: AppColors.primaryGreen,", "")
              with open(filepath, 'w', encoding='utf-8') as f:
                  f.write(content)
          PYEOF

          # ഫോൺ വിളിക്കാനും വാട്സ്ആപ്പ് തുറക്കാനുമുള്ള അനുമതികൾ ചേർക്കുന്നു
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

          # assets ഫോൾഡറുകളും മലയാളം ഫോണ്ടും ഉറപ്പാക്കുന്നു
          mkdir -p assets/fonts assets/images
          touch assets/images/placeholder.txt
          curl -L -s "https://github.com/google/fonts/raw/main/ofl/manjari/Manjari-Regular.ttf" -o assets/fonts/Manjari-Regular.ttf || touch assets/fonts/Manjari-Regular.ttf

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Verify Dart Syntax
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK for Easy Sharing
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/MYL_Palakkad_Official.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MYL-Palakkad-Release-APK
          path: build/app/outputs/flutter-apk/MYL_Palakkad_Official.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.${{ github.run_number }}
          name: "MYL Palakkad App v1.7.${{ github.run_number }}"
          files: build/app/outputs/flutter-apk/MYL_Palakkad_Official.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
