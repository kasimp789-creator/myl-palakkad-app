name: MYL Palakkad - Build Signed Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Complete Android Wrapper & Icons
        run: |
          flutter create --org org.mylpalakkad --platforms android .

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Signed Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK for Easy Sharing
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/MYL_Palakkad_Official.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MYL-Palakkad-Release-APK
          path: build/app/outputs/flutter-apk/MYL_Palakkad_Official.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: "MYL Palakkad App v1.2.${{ github.run_number }}"
          files: build/app/outputs/flutter-apk/MYL_Palakkad_Official.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
