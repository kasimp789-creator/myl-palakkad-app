name: myl_palakkad_app
description: Official Mobile Application for Muslim Youth League Palakkad District Committee.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  pdf: ^3.11.1
  printing: ^5.13.2
  qr_flutter: ^4.1.0
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
