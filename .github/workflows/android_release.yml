name: MYL Palakkad - Build Signed Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (Stable 3.24.5 for 100% Package Compatibility)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Prepare Clean Project & Fix Structure
        run: |
          # ഫയലുകൾ സബ്-ഫോൾഡറിലാണെങ്കിൽ പുറത്തേക്ക് മാറ്റുന്നു
          if [ -d "myl_palakkad_app" ]; then
            cp -r myl_palakkad_app/* .
            rm -rf myl_palakkad_app
          fi

          # Clean pubspec.yaml without conflicting native plugins
          cat << 'EOF' > pubspec.yaml
          name: myl_palakkad_app
          description: Official Mobile Application for Muslim Youth League Palakkad District Committee.
          publish_to: 'none'
          version: 1.2.0+3

          environment:
            sdk: '>=3.2.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            pdf: ^3.11.1
            printing: ^5.13.2
            url_launcher: ^6.3.0
            intl: ^0.19.0

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
            assets:
              - assets/fonts/
              - assets/images/
          EOF

          # പഴയ android ഫോൾഡറും lock ഫയലും മാറ്റി പുതിയത് നിർമ്മിക്കുന്നു
          rm -rf android pubspec.lock
          flutter create --org org.mylpalakkad --project-name myl_palakkad_app --platforms android .

          # ഫോൺ വിളിക്കാനും വാട്സ്ആപ്പ് തുറക്കാനുമുള്ള അനുമതികൾ ചേർക്കുന്നു
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

          # assets ഫോൾഡറുകളും മലയാളം ഫോണ്ടും ഉറപ്പാക്കുന്നു
          mkdir -p assets/fonts assets/images
          touch assets/images/placeholder.txt
          curl -L -s "https://github.com/google/fonts/raw/main/ofl/manjari/Manjari-Regular.ttf" -o assets/fonts/Manjari-Regular.ttf || touch assets/fonts/Manjari-Regular.ttf

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Check Dart Files Before Build
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK for Easy Sharing
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/MYL_Palakkad_Official.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MYL-Palakkad-Release-APK
          path: build/app/outputs/flutter-apk/MYL_Palakkad_Official.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.${{ github.run_number }}
          name: "MYL Palakkad App v1.5.${{ github.run_number }}"
          files: build/app/outputs/flutter-apk/MYL_Palakkad_Official.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
